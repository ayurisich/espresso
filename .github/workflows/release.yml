name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build app
        run: make build

      - name: Package DMG
        run: |
          hdiutil create \
            -volname "Espresso" \
            -srcfolder Espresso.app \
            -ov \
            -format UDZO \
            Espresso.dmg

      - name: Prepare landing page
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p _site
          sed "s/{{VERSION}}/$VERSION/g" docs/index.html > _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Espresso.dmg \
            --title "Espresso $GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
